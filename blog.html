{{define "blog"}}
<!DOCTYPE html>
<html>
<head>
    <title>Blog</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">About</a></li>
                <li><a href="/blog">Blog</a></li>
                <li><a href="/portfolio">Portfolio</a></li>
                <li><a href="/signup">Sign Up</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>
    
    <h1>Blog</h1>
    
    <ul>
        {{range .}}
        <li><a href="/blog/article/{{.ID}}">{{.Title}}</a></li>
        {{else}}
        <li>No articles available.</li>
        {{end}}
    </ul>
    <ul><a href="/blog/createArticle">Create a new article</a></ul>
    
</body>
</html>
{{end}}
