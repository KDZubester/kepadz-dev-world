<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Article</title>
    <script src="https://cdn.tiny.cloud/1/704fcdtd6df8zcy421wy46mtd96nlg8asy39jss7jwqrhke6/tinymce/5/tinymce.min.js"></script>
    <script>
        tinymce.init({
            selector: '#content',  // This is where TinyMCE will apply
            plugins: 'advlist autolink lists link image charmap print preview anchor',
            toolbar: 'undo redo | formatselect | bold italic backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image',
            menubar: false
        });
    </script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">About</a></li>
                <li><a href="/blog">Blog</a></li>
                <li><a href="/portfolio">Portfolio</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/signup">Sign Up</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
        <h1>Create a New Article</h1>
    </header>
    <form action="/saveArticle" method="POST" enctype="multipart/form-data">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>

        <label for="image">Image (URL):</label>
        <input type="text" id="image" name="image" required><br><br>

        <label for="summary">Summary:</label>
        <textarea id="summary" name="summary" required></textarea><br><br>

        <label for="content">Content:</label>
        <textarea id="content" name="content"></textarea><br><br>

        <button type="submit">Save Article</button>
    </form>
</body>
</html>
